services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d smarthome"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: smarthome-temperature-api
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      device-service:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - DEVICE_SERVICE_URL=http://device-service:8082
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  # Задание 6: брокер событий и новые микросервисы

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smarthome-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks:
      - smarthome-network

  device-db:
    image: postgres:16-alpine
    container_name: smarthome-device-db
    environment:
      - POSTGRES_USER=${DEVICE_DB_USER}
      - POSTGRES_PASSWORD=${DEVICE_DB_PASSWORD}
      - POSTGRES_DB=devices
    volumes:
      - ./device-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - device_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d devices"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - smarthome-network

  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: smarthome-device-service
    depends_on:
      device-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=8082
      - DATABASE_URL=postgres://${DEVICE_DB_USER}:${DEVICE_DB_PASSWORD}@device-db:5432/devices
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - POLL_INTERVAL=10s
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: smarthome-telemetry-db
    environment:
      - POSTGRES_USER=${TELEMETRY_DB_USER}
      - POSTGRES_PASSWORD=${TELEMETRY_DB_PASSWORD}
      - POSTGRES_DB=telemetry
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - ./telemetry-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - telemetry_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: smarthome-telemetry-service
    depends_on:
      telemetry-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=8083
      - DATABASE_URL=postgresql://${TELEMETRY_DB_USER}:${TELEMETRY_DB_PASSWORD}@telemetry-db:5432/telemetry
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:
  device_data:
  telemetry_data:

networks:
  smarthome-network:
    driver: bridge